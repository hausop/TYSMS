<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>太陽保險經紀人 - 續年度報酬契約續約通知</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }
    .card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      padding: 28px 24px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      line-height: 1.7;
    }
    h1 {
      font-size: 20px;
      color: #1a365d;
      margin-top: 0;
      margin-bottom: 16px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
      text-align: center;
    }
    .notice {
      background-color: #fffaf0;
      border-left: 4px solid #dd6b20;
      padding: 12px 14px;
      font-size: 15px;
      margin-bottom: 18px;
      border-radius: 4px;
    }
    .highlight {
      color: #c53030;
      font-weight: bold;
    }
    .contact {
      font-size: 14px;
      color: #4a5568;
      background: #edf2f7;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 22px;
      text-align: center;
    }
    .contact a {
      color: #2b6cb0;
      text-decoration: none;
      font-weight: bold;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn {
      display: block;
      text-align: center;
      padding: 15px 16px;
      border-radius: 10px;
      text-decoration: none;
      color: #ffffff;
      font-weight: bold;
      font-size: 16px;
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.85;
    }
    .btn small {
      display: block;
      font-weight: normal;
      font-size: 13px;
      margin-top: 4px;
      opacity: 0.95;
    }
    .btn-purple {
      background-color: #6b46c1;
    }
    .btn-orange {
      background-color: #dd6b20;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>太陽保險經紀人<br>續年度報酬契約續約通知</h1>
    
    <div class="notice">
      請於 <span class="highlight">2026/12/31(四)</span> 前完成申請程序，未於期限內完成者視同契約合意終止，即於2026年度屆滿時，放棄各項權益之請求權。
    </div>

    <div class="contact">
      若有疑問請於上班時間來電<br>
      <a href="tel:079728898">07-9728898</a> 分機 116 或 103
    </div>

    <div class="btn-group">
      <a href="https://reurl.cc/GgWq1G" class="btn btn-purple" target="_blank">
        ✅「有」Gmail 帳號者
        <small>點此辦理續約（可直接上傳繳費單）➔</small>
      </a>

      <a href="https://reurl.cc/8YdAkg" class="btn btn-orange" target="_blank">
        📩「無」Gmail 帳號者
        <small>點此辦理續約（需另Email或傳真單據)➔</small>
      </a>
    </div>
  </div>
</body>
</html>
